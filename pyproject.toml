[project]
name = "brain-bakeoff"
version = "0.1.0"
description = "An LLM, Jev and a fruit-fly connectome play the same seeded tunnel runs"
requires-python = ">=3.13"
dependencies = [
    "brian2>=2.10.1",
    "cython>=3.1.3",
    # joblib: imported at module scope by the authors' pinned model.py, not by our code
    "joblib>=1.6.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "setuptools>=84.0.0",
]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: needs the fly data in data/ (skipped when absent)",
    "live: makes real API requests (opt-in)",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
